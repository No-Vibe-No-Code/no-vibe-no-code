<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Vibe No Code / Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><img src="/logo-symbol.png" alt="">No Vibe No Code</a><a class="outline-button" href="/">Back to site</a></header><main class="content-section"><div><p class="eyebrow">ADMIN / 001</p><h1>Club<br><em>control.</em></h1><p class="lede">Manage member roles, review contact messages, and open competition actions once the club is formed and approved.</p></div><div><section class="panel-form"><h3>Members</h3><div id="users">Loading…</div></section><section class="panel-form"><h3>Contact messages</h3><div id="contacts">Loading…</div></section></div></main><script>const load=async()=>{const [u,c]=await Promise.all([fetch('/api/admin/users'),fetch('/api/admin/contacts')]);if(!u.ok||!c.ok){document.body.innerHTML='<main class="content-section"><h1>Not authorized.</h1><p>Sign in with a club leader, teacher, or maintainer account first.</p></main>';return}const users=(await u.json()).users.results||[];const contacts=(await c.json()).contacts.results||[];document.getElementById('users').innerHTML=users.map(x=>`<p><b>${x.display_name}</b> · ${x.role}<br><small>${x.class_grade}</small></p>`).join('')||'No members yet.';document.getElementById('contacts').innerHTML=contacts.map(x=>`<p><b>${x.name}</b> · ${x.wechat_id}<br>${x.message}</p>`).join('')||'No messages yet.'};load();</script></body></html>
