<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e83e83" />
    <title>No Vibe No Code / Admin</title>
    <link rel="icon" type="image/png" href="/logo-symbol.png" />
    <link rel="apple-touch-icon" href="/logo-symbol.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-page">
    <header class="site-header">
      <a class="brand" href="/"><img src="/logo-symbol.png" alt="" />No Vibe No Code</a>
      <a class="outline-button" href="/">Back to site</a>
    </header>
    <main class="admin-shell">
      <header class="admin-intro">
        <div><p class="eyebrow">ADMIN / 001</p><h1>Club<br /><em>control.</em></h1></div>
        <p class="lede">Manage member roles, reset passwords, review contact messages, and control competition registration.</p>
      </header>
      <p class="form-message" id="adminMessage" role="status"></p>
      <section class="admin-status panel-form">
        <div><p class="eyebrow">COMPETITION</p><h3>Registration status</h3></div>
        <label class="admin-switch"><input id="competitionActive" type="checkbox" /><span>Allow competition actions</span></label>
      </section>
      <section class="panel-form">
        <div class="admin-section-title"><div><p class="eyebrow">MEMBERS</p><h3>Accounts and roles</h3></div><span id="userCount"></span></div>
        <div id="users" class="admin-list">Loading…</div>
      </section>
      <section class="panel-form">
        <div class="admin-section-title"><div><p class="eyebrow">INBOX</p><h3>Contact messages</h3></div><span id="contactCount"></span></div>
        <div id="contacts" class="admin-list">Loading…</div>
      </section>
    </main>
    <script src="/admin.js"></script>
  </body>
</html>
