<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d2e61"><title>Member profile / No Vibe No Code</title><link rel="icon" href="/logo-symbol-icon.png"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/product.css"><script defer src="/min/shared.js?v=20260902-7"></script><script defer src="/min/product-motion.js?v=20260902-8"></script><script defer src="/min/profile.js?v=20260902-8"></script></head>
<body><main class="product-main"><header class="product-topbar"><a class="product-brand" href="/"><img src="/logo-symbol.webp" alt=""><span>No Vibe No Code</span></a><div class="topbar-actions"><a class="secondary-button" href="/gallery.html">Gallery</a><a class="primary-button" href="/home.html">Member home</a></div></header><div class="product-content">
  <header class="page-heading"><div><h2 id="profileTitle">Member profile</h2><p id="profileBio">Loading profile.</p></div><button class="primary-button hidden" id="editToggle">Edit profile</button></header>
  <div class="readme-layout">
    <aside class="panel profile-card"><img class="profile-avatar" id="profileAvatar" src="/logo-symbol.webp" alt=""><div class="profile-meta"><h2 id="displayName"></h2><p id="skills"></p><div id="profileLinks" class="stack"></div></div></aside>
    <section class="panel"><div class="tabs"><button aria-selected="true" id="readmeTab">README</button><button id="projectsTab">Projects</button></div><article class="readme" id="readme"></article><div class="project-grid hidden panel-body" id="profileProjects"></div></section>
  </div>
  <section class="panel hidden" id="profileEditor" style="margin-top:22px"><header class="panel-header"><h3>Edit profile</h3><div><button class="text-button" id="previewReadme">Preview</button><button class="primary-button" id="publishReadme">Publish README</button></div></header><form class="panel-body stack" id="profileForm"><div class="form-grid"><div class="field"><label for="englishName">English name</label><input id="englishName" name="englishName" required></div><div class="field"><label for="chineseName">Chinese name</label><input id="chineseName" name="chineseName" required></div><div class="field"><label for="wechatId">WeChat ID (private)</label><input id="wechatId" name="wechatId" required></div><div class="field"><label for="classGrade">Class and grade (private)</label><input id="classGrade" name="classGrade" required></div></div><div class="field"><label for="bio">Public bio</label><textarea id="bio" name="bio" maxlength="500"></textarea></div><div class="field"><label for="skillsInput">Skills and interests</label><input id="skillsInput" name="skillsInput" placeholder="AI, web design, games"><small>Separate items with commas.</small></div><div class="field"><label for="readmeDraft">Profile README</label><textarea id="readmeDraft" name="readmeDraft" maxlength="20000"></textarea></div><p class="status-message" id="profileMessage"></p><div class="form-actions"><button class="primary-button">Save draft</button></div></form></section>
</div></main></body></html>
